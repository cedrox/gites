author:
  name: Gite de Mer
  email: info@gitedemer.net

# The `>` after `description:` means to ignore line-breaks until next key.
# If you want to omit the line-break after the end of text, use `>-` instead.
description: >
  Location de vacances en bord de mer en Normandie (Cotentin, Manche). 3 gîtes mitoyens face à la mer à Saint-Marcouf-de-l'Isle, à 5 km d'Utah Beach et 10 min de Saint-Vaast-la-Hougue. De 2 à 6 personnes par gîte.

description_en: >
  Holiday rentals by the sea in Normandy (Cotentin, Manche). 3 adjoining gîtes facing the sea in Saint-Marcouf-de-l'Isle, 5 km from Utah Beach and 10 min from Saint-Vaast-la-Hougue. 2 to 6 people per gîte.

